[project]
name = "gfpt"
version = "2.0.0"
description = "Google Flights Price Tracker — Lambda-based saved-flights price monitor with Telegram alerts"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Imports must follow the sys.path/.env bootstrap in the local harness
"scripts/run_local.py" = ["E402"]
